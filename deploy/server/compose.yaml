name: lvk-server
services:
  lvk:
    image: ${LVK_IMAGE:?Set LVK_IMAGE to a versioned GHCR image}
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "443:8443"
    environment:
      LVK_HOST: ${LVK_HOST:?Set LVK_HOST to a public IP or DNS hostname}
      LVK_PREVIEW_DOMAIN: ${LVK_PREVIEW_DOMAIN:-}
    volumes:
      - home:/home/appuser
      - repos:/repos
      - work:/var/tmp
      - type: bind
        source: ./secrets
        target: /run/lvk-secrets
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  home:
  repos:
  work:
