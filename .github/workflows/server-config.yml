name: Validate server distribution
on:
  pull_request:
    paths:
      - "deploy/server/**"
      - "deploy/browser/**"
      - "deploy/developer/**"
      - "tests/server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/*server*"
      - "docs/self-hosting/server-container.mdx"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "deploy/server/**"
      - "deploy/browser/**"
      - "deploy/developer/**"
      - "tests/server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/*server*"
      - "docs/self-hosting/server-container.mdx"
      - "package.json"
      - "pnpm-lock.yaml"
permissions:
  contents: read
env:
  NODE_VERSION: "22.22.1"
  PNPM_VERSION: "10.13.1"
jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y nginx apache2-utils
      - run: pnpm run server:check
        env:
          LVK_REQUIRE_NGINX_TEST: "1"
      - run: pnpm run developer:check
      - name: Validate Compose syntax without starting containers
        run: |
          docker compose -f deploy/server/compose.yaml config --quiet
          docker compose -f deploy/server/compose.yaml -f deploy/server/compose.acme.yaml config --quiet
          docker compose -f deploy/server/compose.yaml -f deploy/server/compose.acme.yaml -f deploy/server/compose.development.yaml --profile development config --quiet
          docker compose -f deploy/server/compose.yaml -f deploy/server/compose.development.yaml -f deploy/developer/compose.updater.yaml --profile development config --quiet
          LVK_HOST=lvk.example.test docker compose -f deploy/server/compose.yaml config --quiet
        env:
          LVK_IMAGE: ghcr.io/example/lvk:test
          LVK_HOST: 192.0.2.1
          LVK_ACME_AGREE_TOS: "yes"
